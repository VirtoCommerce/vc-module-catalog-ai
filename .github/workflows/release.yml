name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
      BLOB_SAS: ${{ secrets.BLOB_TOKEN }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Read manifest
        id: meta
        run: |
          MODULE_ID=$(grep -oPm1 '(?<=<id>)[^<]+' module.manifest)
          VERSION=$(grep -oPm1 '(?<=<version>)[^<]+' module.manifest)
          echo "moduleId=$MODULE_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        env:
          MODULE_ID: ${{ steps.meta.outputs.moduleId }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ZIP="${MODULE_ID}_${VERSION}.zip"
          mkdir -p artifacts
          zip -r "artifacts/${ZIP}" module.manifest ai
          echo "zip=artifacts/${ZIP}" >> "$GITHUB_OUTPUT"
          echo "Packaged artifacts/${ZIP}"

      - name: Publish to Blob
        id: blobRelease
        uses: VirtoCommerce/vc-github-actions/publish-blob-release@master
        with:
          blobSAS: ${{ secrets.BLOB_TOKEN }}
          blobUrl: ${{ vars.BLOB_URL }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create "${VERSION}" "${ZIP}" \
            --title "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
