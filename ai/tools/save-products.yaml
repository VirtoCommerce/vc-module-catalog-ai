name: vc_catalog_save_products
description: |
  Create or update catalog products in batch (server upserts by `id`).
  Pass `id: null` (or omit `id`) to create a new product. Pass an existing `id`
  to update — the server merges fields you provide and preserves the rest.

  Typical use in the bundle-building flow is to create the **configurable parent
  product** that will own a `ProductConfiguration` made of sections + options.
  Set `productType: "Configurable"` and provide `catalogId`, `categoryId`, `name`,
  and a unique `code`. The server returns the saved products including the
  generated `id`, which you then pass to `vc_catalog_save_product_configuration`.

  Replace semantics on collection fields (`properties`, `reviews`, `assets`, …)
  match the platform default: when you send a collection it replaces the existing
  one entirely — include all entries you want to keep, both existing and new.
require_approval: true

parameters:
  type: object
  properties:
    products:
      type: array
      minItems: 1
      maxItems: 50
      description: Products to create or update
      items:
        type: object
        properties:
          id:
            type: string
            description: Product id — omit/null to create, set to update an existing product
          catalogId:
            type: string
            description: Catalog id the product belongs to (required when creating)
          categoryId:
            type: string
            description: Category id the product belongs to
          code:
            type: string
            description: Unique product code / SKU
          name:
            type: string
            description: Product display name (in catalog default language)
          productType:
            type: string
            description: |
              Product type. Use `"Configurable"` for bundle parent products,
              `"Physical"` (default) for regular SKUs.
          isActive:
            type: boolean
            default: true
          isBuyable:
            type: boolean
            default: true
          trackInventory:
            type: boolean
          vendor:
            type: string
          properties:
            type: array
            description: Property values attached to the product (replace semantics)
            items:
              type: object
        required:
          - name
  required:
    - products

execution:
  endpoint: /api/ai/catalog/products/batch
  method: POST
  mappings:
    request:
      body:
        products: "{{products}}"
    response:
      items: >-
        products[*].{
          id: id,
          code: code,
          name: name,
          productType: productType,
          catalogId: catalogId,
          categoryId: categoryId
        }

#permission:
#  - catalog:update

tags:
  - catalog
  - products
  - write
