name: vc_catalog_search_listentries
description: |
  Browse the catalog tree. Returns mixed list entries — categories and/or products —
  filtered by catalog, parent category, keyword, or object type. Use this when you
  need to discover the **category** a new product should live under (e.g. to find
  "Bundles", "Workstations", or a slot category like "Motherboards" within a given
  catalog) before creating a configurable product with `vc_catalog_save_products`.
  Pass `objectType: "category"` to restrict results to categories only — that's the
  usual call for "where should I park this bundle?". Each entry has a `type`
  ("category" or "product"), an `id`, `name`, and `outline` (parent path of ids).
require_approval: false

parameters:
  type: object
  properties:
    catalogId:
      type: string
      description: Restrict the search to a single catalog
    categoryId:
      type: string
      description: Restrict the search to children of this category id (browse mode)
    keyword:
      type: string
      description: Free-text query matching category or product names
    objectType:
      type: string
      enum: [category, product]
      description: Restrict result type — "category" for tree browsing, "product" for product browsing
    searchInChildren:
      type: boolean
      default: true
      description: Recurse into sub-categories when listing under a categoryId
    skip:
      type: integer
      default: 0
      minimum: 0
    take:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
  required: []

execution:
  endpoint: /api/catalog/listentries
  method: POST
  mappings:
    request:
      body:
        catalogId: "{{catalogId}}"
        categoryId: "{{categoryId}}"
        keyword: "{{keyword}}"
        objectType: "{{objectType}}"
        searchInChildren: "{{searchInChildren}}"
        skip: "{{skip}}"
        take: "{{take}}"
    response:
      items: >-
        results[*].{
          type: type,
          id: id,
          name: name,
          code: code,
          outline: outline,
          isActive: isActive
        }
      totalCount: "totalCount"

#permission:
#  - catalog:read

tags:
  - catalog
  - categories
  - search
  - read
