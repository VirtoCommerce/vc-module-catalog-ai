name: vc_catalog_update_products_translations
description: |
  Apply translation updates to catalog products in batch.
  The server loads each product by `id` and overwrites **only** the fields you provide:
  `name`, `localizedName` and/or `reviews`. Every other field (`categoryId`, `code`,
  `properties`, `images`, `variations`, `seoInfos`, `associations`, etc.) is preserved
  exactly as-is on the server — you do not need to round-trip them.
  Replace semantics: when `localizedName` or `reviews` is provided, it **replaces** the
  existing collection entirely, so include all entries you want to keep (existing + new).
  When a field is omitted (null), the server leaves it untouched.

parameters:
  type: object
  properties:
    products:
      type: array
      minItems: 1
      description: Translation updates to apply, one entry per product
      items:
        type: object
        properties:
          id:
            type: string
            description: Product id (required — identifies the product to update)
          name:
            type: string
            description: |
              Default product name (in catalog default language). Usually omitted by the
              translation flow — translations go into `localizedName` instead.
          localizedName:
            type: object
            description: |
              Localized product names. Shape - `{ values: { "<languageCode>": "<translated name>" } }`.
              When provided, **replaces** the entire localizedName on the server, so include
              all language entries you want to keep, both existing and new.
            properties:
              values:
                type: object
                description: Dictionary of language codes to translated names
                additionalProperties:
                  type: string
          reviews:
            type: array
            description: |
              Editorial reviews (descriptions) per language. When provided, **replaces** the
              entire reviews collection on the server, so include all entries you want to
              keep, both existing and newly translated.
            items:
              type: object
              properties:
                id:
                  type: string
                  description: Existing review id (preserve when keeping/editing an existing entry; omit when adding a new translation)
                content:
                  type: string
                  description: Review text (HTML supported)
                reviewType:
                  type: string
                  description: Review type (e.g. "QuickReview", "FullReview")
                languageCode:
                  type: string
                  description: Language code (e.g. "en-US")
              required:
                - content
                - languageCode
                - reviewType
        required:
          - id
  required:
    - products

execution:
  endpoint: /api/ai/catalog/products/batch-translate
  method: POST
  mappings:
    request:
      body:
        products: "{{products}}"

#permission:
#  - catalog:update

tags:
  - catalog
  - products
  - translation
  - write
